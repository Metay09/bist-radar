server { listen 80; server_name _; root /usr/share/nginx/html; index index.html;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ { proxy_pass http://bist-radar-api:8765/; proxy_set_header Host $host; proxy_connect_timeout 5s; }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always;
}
