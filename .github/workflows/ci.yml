name: quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: make check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bist_radar_test
          POSTGRES_USER: bist_radar
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bist_radar -d bist_radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bist_radar:test-only-password@127.0.0.1:5432/bist_radar_test
      TRADING_MODE: paper
      LIVE_TRADING: "false"
      ML_MODE: shadow
      ALLOW_ML_TO_CHANGE_RADAR: "false"
      AUTO_PROMOTION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: python scripts/verify_postgres_migrations.py
      - run: alembic downgrade 0012
      - run: alembic upgrade head
      - run: python scripts/verify_postgres_migrations.py
